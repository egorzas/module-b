<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Авторизация — Админ-панель «Кухни мира»</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-box">
      <h1 style="font-size: 22px; margin-bottom: 6px;">Админ-панель «Кухни мира»</h1>
      <p style="color: var(--muted); font-size: 13px; margin-bottom: 20px;">Год единства народов России — 2026</p>

      <!-- Вкладка 1: Стандартный вход (по умолчанию) -->
      <form action="recipes.html">
        <div class="form-group">
          <label for="email">Электронная почта *</label>
          <input type="email" id="email" class="form-control" value="admin@champ2026" required>
          <span class="css-live-error">Введите корректный адрес электронной почты.</span>
        </div>

        <div class="form-group">
          <label for="password">Пароль *</label>
          <input type="password" id="password" class="form-control" value="champ2026" required>
          <span class="css-live-error">Поле пароля обязательно для заполнения.</span>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Войти в панель управления</button>
      </form>

      <!-- Демонстрация состояния ошибки валидации по ТЗ (раскрывается по клику) -->
      <details class="css-accordion" style="margin-top: 16px; border-top: 1px solid #e2e8f0; padding-top: 12px;">
        <summary style="font-size: 12px; color: var(--muted); text-align: center;">Показать пример ошибки валидации полей</summary>
        <div style="margin-top: 12px;">
          <div class="form-group">
            <label>Электронная почта *</label>
            <input type="email" class="form-control is-invalid" value="wrong@mail.ru" readonly>
            <span class="error-text">Пользователь с таким E-mail не найден.</span>
          </div>
          <div class="form-group">
            <label>Пароль *</label>
            <input type="password" class="form-control is-invalid" value="12345" readonly>
            <span class="error-text">Неверный пароль администратора.</span>
          </div>
        </div>
      </details>
    </div>
  </div>
</body>
</html>
